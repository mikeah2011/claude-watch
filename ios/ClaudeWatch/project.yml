name: ClaudeWatch
options:
  bundleIdPrefix: ${BUNDLE_ID_PREFIX}
  deploymentTarget:
    iOS: ${IOS_DEPLOYMENT_TARGET}
    watchOS: ${WATCHOS_DEPLOYMENT_TARGET}
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: ${SWIFT_VERSION}
    ONLY_ACTIVE_ARCH: true
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    MARKETING_VERSION: ${APP_VERSION}
    CURRENT_PROJECT_VERSION: ${APP_BUILD}
    BUNDLE_ID_PREFIX: ${BUNDLE_ID_PREFIX}
    IOS_BUNDLE_SUFFIX: ${IOS_BUNDLE_SUFFIX}

targets:
  ClaudeWatch:
    type: application
    platform: iOS
    sources:
      - path: "ClaudeWatch iOS"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.${IOS_BUNDLE_SUFFIX}
        INFOPLIST_FILE: "ClaudeWatch iOS/Info.plist"
        PRODUCT_NAME: ${PRODUCT_NAME}
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: ClaudeWatchWatch
        embed: true

  ClaudeWatchWatch:
    type: application
    platform: watchOS
    sources:
      - path: "ClaudeWatch watchOS"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID_PREFIX}.${WATCH_BUNDLE_SUFFIX}
        INFOPLIST_FILE: "ClaudeWatch watchOS/Info.plist"
        PRODUCT_NAME: ${PRODUCT_NAME}
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_MACCATALYST: false
        ARCHS: "arm64 arm64e arm64_32"
        "EXCLUDED_ARCHS[sdk=watchsimulator*]": arm64e

schemes:
  ClaudeWatch:
    build:
      targets:
        ClaudeWatch: all
        ClaudeWatchWatch: all
    run:
      config: Debug
  ClaudeWatchWatch:
    build:
      targets:
        ClaudeWatchWatch: all
    run:
      config: Debug
      executable: ClaudeWatchWatch
